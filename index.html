<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Educación en Valores Cívicos y Éticos — 4.º ESO</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6FAF8;--surface:#FFFFFF;--surface2:#EDF4F0;--surface3:#DFF0E8;--text:#1C2E26;--text-muted:#6B8C7A;--border:#C8DECE;--correct:#1A6B3A;--correct-bg:rgba(26,107,58,.1);--wrong:#C0392B;--wrong-bg:rgba(192,57,43,.1);--accent:#1A7A5E;--accent-light:rgba(26,122,94,.1);--radius:12px;--shadow:0 1px 4px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app{max-width:800px;margin:0 auto;padding:1.5rem 1rem 3rem}
.header{text-align:center;padding:2rem 0 1.5rem}
.header h1{font-family:'DM Serif Display',serif;font-size:clamp(1.4rem,3.5vw,2.1rem);margin-bottom:.3rem;color:var(--accent)}
.header p{color:var(--text-muted);font-size:.9rem;font-weight:300}
/* LOGIN */
.login-screen{max-width:460px;margin:0 auto;text-align:center}
.login-screen h2{font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:.5rem}
.login-screen>p{color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 1.8rem;text-align:left;box-shadow:var(--shadow)}
.login-toggle{display:flex;border-radius:10px;background:var(--surface2);padding:4px;margin-bottom:1.5rem;gap:4px}
.toggle-btn{flex:1;padding:.6rem;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;background:transparent;color:var(--text-muted);transition:all .2s}
.toggle-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:.35rem}
.field input,.field select{width:100%;padding:.75rem 1rem;background:var(--surface2);border:2px solid transparent;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.95rem;color:var(--text);transition:border-color .2s;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.hint{font-size:.72rem;color:var(--text-muted);margin-top:.3rem;opacity:.8}
.error-msg{display:none;color:var(--wrong);font-size:.78rem;margin-top:.3rem;font-weight:600}
.login-btn{width:100%;padding:.9rem;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;margin-top:.5rem;transition:opacity .2s}
.login-btn:hover{opacity:.88}
/* QUIZ */
.student-tag{display:inline-flex;align-items:center;gap:.4rem;background:var(--accent-light);color:var(--accent);border-radius:20px;padding:.3rem .9rem;font-size:.8rem;font-weight:700;margin-bottom:1rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.progress-wrap{background:var(--surface3);border-radius:20px;height:6px;margin-bottom:.5rem;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:20px;transition:width .4s}
.progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-muted);margin-bottom:1.2rem}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.8rem 2rem;box-shadow:var(--shadow)}
.q-type{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;padding:.25rem .7rem;border-radius:6px;background:var(--accent-light);color:var(--accent);margin-bottom:.9rem}
.q-text{font-size:1.05rem;font-weight:700;margin-bottom:1.2rem;line-height:1.5}
.options{display:flex;flex-direction:column;gap:.55rem}
.option-btn{display:flex;align-items:center;gap:.85rem;padding:.9rem 1rem;border:2px solid var(--border);border-radius:10px;background:transparent;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.92rem;text-align:left;color:var(--text);transition:all .2s;line-height:1.4}
.option-btn:hover:not(.disabled){border-color:var(--accent);background:var(--accent-light)}
.option-btn.disabled{cursor:default}
.option-btn .letter{min-width:28px;height:28px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;flex-shrink:0;transition:all .2s}
.option-btn.correct{border-color:var(--correct);background:var(--correct-bg)}
.option-btn.correct .letter{background:var(--correct);color:#fff}
.option-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.option-btn.wrong .letter{background:var(--wrong);color:#fff}
.feedback{margin-top:1rem;padding:1rem 1.1rem;border-radius:10px;font-size:.88rem;line-height:1.5;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--correct-bg);border-left:3px solid var(--correct)}
.feedback.ko{background:var(--wrong-bg);border-left:3px solid var(--wrong)}
.feedback strong{display:block;margin-bottom:.25rem;font-size:.9rem}
.next-btn{display:none;margin-top:1.2rem;padding:.75rem 1.8rem;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.next-btn:hover{opacity:.88}
.next-btn.show{display:inline-block}
/* RESULTS */
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;text-align:center;box-shadow:var(--shadow);margin-bottom:1.5rem}
.result-score{font-family:'DM Serif Display',serif;font-size:4rem;color:var(--accent);line-height:1}
.result-label{font-size:.85rem;color:var(--text-muted);margin:.4rem 0 1rem}
.result-stats{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.stat-pill{padding:.4rem 1.1rem;border-radius:20px;font-size:.82rem;font-weight:700;background:var(--surface2)}
.restart-btn{padding:.7rem 1.8rem;border:2px solid var(--border);border-radius:10px;background:transparent;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;color:var(--text);transition:all .2s;margin-top:.5rem}
.restart-btn:hover{border-color:var(--accent);color:var(--accent)}
/* REVIEW */
.review-section{margin-top:1.5rem;text-align:left}
.review-section h3{font-family:'DM Serif Display',serif;font-size:1.2rem;margin-bottom:.8rem;text-align:center}
.review-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;margin-bottom:.5rem;border-left:3px solid var(--text-muted)}
.review-item.rev-correct{border-left-color:var(--correct)}
.review-item.rev-wrong{border-left-color:var(--wrong)}
.review-item .rev-q{font-weight:700;font-size:.85rem;margin-bottom:.3rem}
.review-item .rev-detail{font-size:.8rem;color:var(--text-muted);line-height:1.4}
.review-item .rev-detail span.ok{color:var(--correct);font-weight:600}
.review-item .rev-detail span.ko{color:var(--wrong);font-weight:600}
/* PANEL */
.panel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.8rem;box-shadow:var(--shadow);margin-bottom:1rem}
.panel-card h2{font-family:'DM Serif Display',serif;font-size:1.4rem;margin-bottom:.8rem}
.ranking-table-wrap{overflow-x:auto;margin-top:.8rem}
.ranking-table{width:100%;border-collapse:collapse;font-size:.85rem}
.ranking-table th{background:var(--accent-light);color:var(--accent);padding:.5rem .7rem;text-align:left;font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
.ranking-table td{padding:.5rem .7rem;border-bottom:1px solid var(--border)}
.ranking-table tr:hover td{background:var(--surface2)}
.rank-gold{color:#B7791F}.rank-silver{color:#718096}.rank-bronze{color:#C05621}
.excel-btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;padding:.75rem 1.5rem;border:2px solid var(--correct);border-radius:10px;background:transparent;color:var(--correct);font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s}
.excel-btn:hover{background:var(--correct);color:#fff}
.sending-msg{text-align:center;padding:1.5rem;color:var(--text-muted);font-size:.9rem}
.footer{text-align:center;margin-top:2.5rem;font-size:.7rem;color:var(--text-muted);opacity:.5}
@media(max-width:500px){.question-card{padding:1.3rem 1rem}.login-box{padding:1.5rem 1.2rem}.ranking-table{font-size:.75rem}}
</style>

    <h1>Educación en Valores Cívicos y Éticos</h1>

  </div>
  <div id="content"></div>
  <div class="footer">Educación en Valores Cívicos y Éticos · IES Alquipir · Cehegín · 2024-2025</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ══════════════════════════════════════════════════
//  ⚙️  CONFIGURACIÓN — PEGAR URL APPS SCRIPT AQUÍ
// ══════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzD3PrdYYDbuFGfhkGsQ9oeJXiSHc1uVR3O4crSSnw3hv9qpdjrE-GjG0rzStvVG5zZ/exec';
const TEACHER_PASS    = 'VALORES2025';
const STORAGE_KEY     = 'quiz_valores_eso_v1';

// ══════════════════════════════════════════════════
//  BANCO DE PREGUNTAS — 30 preguntas · 4.º ESO
// ══════════════════════════════════════════════════
const Q = [
// ── BLOQUE 1: ¿Qué es la ética? ──────────────────
{n:1, q:'¿Cuál es la diferencia fundamental entre «ética» y «moral»?',
 o:['Son términos exactamente sinónimos sin diferencia alguna',
    'La moral es la reflexión filosófica sobre los valores; la ética es el conjunto de normas concretas de una comunidad',
    'La ética es la reflexión filosófica sobre los valores morales; la moral es el conjunto de normas concretas adoptadas por una comunidad',
    'La ética proviene del latín «mos» y la moral del griego «ethos»'],
 c:2, e:'La ética (del griego ethos) reflexiona filosóficamente sobre los valores; la moral (del latín mos) es el conjunto de normas concretas de una comunidad.'},

{n:2, q:'¿Cuál de estas preguntas NO es una pregunta fundamental de la ética?',
 o:['¿Qué es el bien?',
    '¿Qué es lo justo?',
    '¿Cuál es el origen del universo?',
    '¿Son universales los principios morales?'],
 c:2, e:'La pregunta por el origen del universo es propia de la cosmología, no de la ética. Las demás sí son preguntas éticas fundamentales.'},

{n:3, q:'¿Qué caracteriza a una persona «heterónoma» moralmente?',
 o:['Toma sus decisiones libremente aplicando criterios racionales propios',
    'Su voluntad se guía por los instintos, deseos, tradición o la autoridad de otras personas',
    'Define sus propios principios morales sin ninguna influencia externa',
    'Actúa siempre por deber, siguiendo el imperativo categórico'],
 c:1, e:'La persona heterónoma deja que factores externos (instinto, tradición, premios, castigos, modas) dirijan su conducta en lugar de su propia razón.'},

// ── BLOQUE 2: Universalismo y pluralismo moral ────
{n:4, q:'El «universalismo moral» afirma que:',
 o:['Cada cultura tiene sus propios valores morales válidos únicamente en ese contexto',
    'No hay una forma absoluta de resolver los dilemas morales',
    'Existen criterios morales universales admitidos por todas las personas, independientemente de su cultura',
    'La moral debe adaptarse a cada época histórica sin principios permanentes'],
 c:2, e:'El universalismo moral sostiene que hay criterios universales válidos para toda la humanidad, como la condena del genocidio o la prohibición de la tortura.'},

{n:5, q:'¿Cuál de los siguientes es un ejemplo de PLURALISMO moral?',
 o:['La condena universal del genocidio en la Convención de la ONU',
    'La prohibición internacional de la tortura en la Declaración de los Derechos Humanos',
    'El debate sobre la eutanasia, donde se contraponen la autonomía individual y el valor intrínseco de la vida',
    'El consenso global sobre la protección de la infancia'],
 c:2, e:'La eutanasia es un ejemplo de pluralismo moral: existen posiciones legítimas y contrapuestas entre defensores de la autonomía y detractores desde la deontología o la religión.'},

// ── BLOQUE 3: Kant, Aristóteles y la virtud ───────
{n:6, q:'Según Kant, el «imperativo categórico» puede formularse como:',
 o:['«Actúa siempre buscando la mayor felicidad para el mayor número de personas»',
    '«Obra de tal manera que lo que hagas quieras que se convierta en ley universal»',
    '«La virtud es el término medio entre dos extremos viciosos»',
    '«El fin último de todas nuestras acciones es la felicidad (eudaimonía)»'],
 c:1, e:'El imperativo categórico kantiano prescribe actuar solo según principios que puedas desear que sean leyes universales para toda la humanidad.'},

{n:7, q:'Para Kant, el «acto moral» solo es verdaderamente moral si:',
 o:['Produce las mejores consecuencias para la mayor cantidad de personas posible',
    'Es realizado por deber y no por inclinación, por libre respeto a la ley moral',
    'Es aprobado por la mayoría de la sociedad en la que se vive',
    'Produce felicidad y bienestar tanto en quien actúa como en los demás'],
 c:1, e:'La ética deontológica de Kant sostiene que la moralidad reside en la voluntad que motiva el acto, no en sus consecuencias. Solo actuar por deber tiene valor moral.'},

{n:8, q:'Para Aristóteles, ¿cuál es el «fin último» de todas las acciones humanas (eudaimonia)?',
 o:['La acumulación de riqueza y bienes materiales',
    'El honor y el reconocimiento social',
    'La felicidad, entendida como vivir y actuar conforme a la razón',
    'El placer sensorial y el goce inmediato'],
 c:2, e:'Para Aristóteles la eudaimonía es el bien supremo: consiste en ejercitar la actividad racional, que es la obra peculiar del ser humano.'},

{n:9, q:'La «ética de la virtud» sostiene que el saber ético tiene que ver principalmente con:',
 o:['Las normas que debemos obedecer para alcanzar la igualdad social',
    'Las consecuencias de nuestros actos y su impacto en el bienestar general',
    'Lo que somos como personas y el desarrollo de un carácter moral sólido',
    'Los derechos y deberes que nos corresponden como ciudadanos'],
 c:2, e:'La ética de la virtud afirma que si desarrollamos un carácter virtuoso, actuaremos correctamente. El saber ético es sobre lo que somos, no solo sobre lo que hacemos.'},

{n:10, q:'En la tabla aristotélica, ¿cuál es la virtud (término medio) entre «cobardía» y «temeridad»?',
 o:['Templanza',
    'Generosidad',
    'Valentía',
    'Prudencia'],
 c:2, e:'La valentía es el término medio entre el defecto de la cobardía (miedo desmedido) y el exceso de la temeridad (atrevimiento sin control).'},

{n:11, q:'Según Aristóteles, los «bienes auténticos» del ser humano son:',
 o:['Los bienes externos como las riquezas y el poder económico',
    'Los bienes corporales como el placer y la salud física',
    'Los bienes del alma intelectiva, ya que el intelecto caracteriza al ser humano',
    'Los bienes sociales como el honor y la fama reconocida por la comunidad'],
 c:2, e:'Aristóteles descarta riquezas, placeres y honor como fines últimos. Solo los bienes del alma intelectiva son auténticos, pues el intelecto es lo propio del ser humano.'},

// ── BLOQUE 4: Harari, Bauman, Beck ───────────────
{n:12, q:'Yuval Noah Harari señala que tecnologías como CRISPR plantean dilemas éticos porque:',
 o:['Permiten copiar libros protegidos por derechos de autor',
    'Pueden usarse para modificar embriones humanos, seleccionar rasgos y acentuar la desigualdad',
    'Sustituyen a los médicos en los hospitales aumentando el desempleo',
    'Generan dependencia tecnológica exclusivamente en los países en desarrollo'],
 c:1, e:'CRISPR permite editar el genoma humano: podría seleccionar rasgos físicos o mentales y crear una "clase superior" biológicamente mejorada que agrave las desigualdades.'},

{n:13, q:'¿Qué solución sugiere Harari para mitigar el desempleo causado por la automatización?',
 o:['Prohibir el desarrollo de la inteligencia artificial en países desarrollados',
    'Reducir las jornadas laborales a cuatro días semanales',
    'La renta básica universal como compensación a quienes pierden su trabajo',
    'Crear más empresas públicas que absorban a los desempleados'],
 c:2, e:'Harari propone la renta básica universal para compensar a las personas que han perdido sus trabajos debido a la automatización y la robotización.'},

{n:14, q:'La «modernidad líquida» de Zygmunt Bauman hace referencia a:',
 o:['La contaminación del agua en las sociedades industrializadas',
    'La inestabilidad y fluidez de las estructuras sociales y morales en la sociedad contemporánea',
    'El exceso de información digital que circula en las redes sociales',
    'La democratización del conocimiento gracias a internet'],
 c:1, e:'Bauman usa la metáfora de "lo líquido" para describir que las estructuras sociales (familia, trabajo, identidad, religión) han perdido su solidez y se transforman constantemente.'},

{n:15, q:'Ulrich Beck, en su teoría de la «sociedad del riesgo», sostiene que:',
 o:['Los riesgos modernos son previsibles y fácilmente gestionables a nivel local',
    'Los riesgos globales son consecuencias del desarrollo industrial que afectan a toda la humanidad, ricos y pobres por igual',
    'Solo los países pobres sufren los riesgos del desarrollo tecnológico',
    'La economía de mercado elimina los riesgos sociales de manera natural'],
 c:1, e:'Beck señala que los riesgos contemporáneos (colapso ecológico, crisis financieras) son más impredecibles y globales, y exigen una ética y respuesta global coordinada.'},

// ── BLOQUE 5: Autonomía moral, sesgos y privacidad
{n:16, q:'La «autonomía moral» consiste en:',
 o:['La capacidad de obedecer las normas sociales establecidas sin cuestionarlas',
    'La tendencia a actuar guiados por el instinto y los deseos naturales',
    'La capacidad de tomar decisiones éticas por sí mismo, reflexionando críticamente sobre los valores',
    'La dependencia de la autoridad religiosa para determinar qué es correcto'],
 c:2, e:'La autonomía moral se alcanza cuando la persona reflexiona críticamente sobre los valores que ha internalizado y decide cuáles adoptar de manera consciente.'},

{n:17, q:'Los «prejuicios sociales» se caracterizan por ser:',
 o:['Conclusiones basadas en la experiencia personal directa y el razonamiento crítico',
    'Creencias preconcebidas e irracionales que tienden a marginar o discriminar a ciertos grupos',
    'Normas morales universales reconocidas por todas las culturas del mundo',
    'Opiniones fundamentadas en datos científicos verificados y contrastados'],
 c:1, e:'Los prejuicios sociales son creencias irracionales basadas en estereotipos culturales, no en razonamiento crítico. Ejemplos: racismo, sexismo y xenofobia.'},

{n:18, q:'¿Qué es el «perfilado» en el contexto del «big data» e inteligencia artificial?',
 o:['La creación de contraseñas seguras para proteger la privacidad en internet',
    'El bloqueo de contenidos inapropiados en internet',
    'La creación de modelos predictivos del comportamiento y preferencias de los individuos a partir de sus datos',
    'El proceso de selección de candidatos para empleos públicos mediante oposiciones'],
 c:2, e:'El perfilado usa grandes cantidades de datos personales para crear modelos predictivos que pueden influir en decisiones comerciales, políticas o personales sin que el usuario lo sepa.'},

{n:19, q:'La «brecha digital» hace referencia a:',
 o:['La diferencia de velocidad entre distintas conexiones a internet',
    'Los errores de programación en los sistemas de inteligencia artificial',
    'La desigualdad en el acceso, uso y aprovechamiento de las tecnologías de la información entre distintos grupos sociales o países',
    'La obsolescencia de los dispositivos tecnológicos en el mercado'],
 c:2, e:'La brecha digital se manifiesta entre distintos grupos sociales, regiones y países, y tiene implicaciones en los ámbitos educativo, económico, social y cultural.'},

// ── BLOQUE 6: Naturaleza humana e identidad ──────
{n:20, q:'Los instintos humanos se caracterizan por ser:',
 o:['Comportamientos aprendidos exclusivamente a través de la educación formal',
    'Comportamientos innatos, automáticos y universales con base biológica, orientados a la supervivencia',
    'Hábitos adquiridos mediante la imitación de los modelos culturales dominantes',
    'Decisiones conscientes tomadas por la razón para adaptarse al entorno social'],
 c:1, e:'Los instintos son biológicos e innatos (supervivencia, reproducción, social). Aunque el ser humano está sujeto a ellos, puede trascenderlos mediante la razón y la cultura.'},

{n:21, q:'La diferencia fundamental entre el comportamiento animal y el humano es que:',
 o:['El animal tiene «mundo» (Welt) significativo; el humano solo tiene «entorno» (Unwelt)',
    'En el animal hay «principiación cognoscitiva»; en el humano solo «mediación cognoscitiva»',
    'En el animal hay «mediación cognoscitiva»; en el humano, «principiación cognoscitiva»: el intelecto es el principio de su acción',
    'El animal actúa por principios racionales; el humano, por instintos puramente biológicos'],
 c:2, e:'El animal necesita el conocimiento para realizar sus actividades vitales (mediación). En el humano el intelecto es el principio (origen) de la acción: construye su mundo desde el pensamiento.'},

{n:22, q:'La «identidad personal» consiste fundamentalmente en:',
 o:['El conjunto de rasgos físicos externos que nos diferencian de los demás',
    'El número de identificación oficial que nos asigna el Estado',
    'Tener conciencia de quiénes somos y cómo pensamos, sentimos y actuamos',
    'La profesión y el estatus social que alcanzamos en la vida adulta'],
 c:2, e:'La identidad personal es la conciencia de quiénes somos. No es algo fijo: va cambiando con las experiencias vitales, los aprendizajes, las relaciones y los cambios en nuestras ideas.'},

// ── BLOQUE 7: Emociones, autoestima y relaciones ─
{n:23, q:'La «educación emocional» tiene como finalidad:',
 o:['Reprimir o suprimir las emociones negativas para mantener la calma en todo momento',
    'Desarrollar competencias para identificar, expresar y gestionar las emociones de forma adecuada',
    'Conseguir que los alumnos no muestren sus sentimientos en público',
    'Enseñar a ignorar las emociones propias para centrarse en el rendimiento académico'],
 c:1, e:'La educación emocional no busca reprimir las emociones sino gestionarlas inteligentemente, desarrollando habilidades para afrontar conflictos y mejorar las relaciones interpersonales.'},

// ══════════════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════════════
let stu={name:'',email:'',curso:''},qs=[],cur=0,sc=0,tp=0,lg=[];
const ct=document.getElementById('content');

function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function gR(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}
function sR(e){const r=gR();r.push(e);localStorage.setItem(STORAGE_KEY,JSON.stringify(r))}

// ══════════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════════
function showLogin(m){
  m=m||'alumno';
  ct.innerHTML=`<div class="login-screen">
    <h2>${m==='alumno'?'Identificación del alumno/a':'Acceso del profesor'}</h2>
    <p>${m==='alumno'?'Introduce tus datos para comenzar el examen de recuperación.':'Introduce la contraseña de acceso.'}</p>
    <div class="login-box">
      <div class="login-toggle">
        <button class="toggle-btn ${m==='alumno'?'active':''}" onclick="showLogin('alumno')">Alumno/a</button>
        <button class="toggle-btn ${m==='profesor'?'active':''}" onclick="showLogin('profesor')">Profesor</button>
      </div>
      <div id="lf">${m==='alumno'?sF():tF()}</div>
    </div>
  </div>`;
  const f=document.querySelector('#lf input');if(f)setTimeout(()=>f.focus(),80);
}

function sF(){return`
  <div class="field"><label>Nombre completo</label>
    <input type="text" id="in" placeholder="Ej: María López García">
    <div class="error-msg" id="en">Introduce tu nombre completo</div>
  </div>
  <div class="field"><label>Correo corporativo</label>
    <input type="email" id="ie" placeholder="tucorreo@murciaeduca.es">
    <div class="hint">@murciaeduca.es · @alu.murciaeduca.es · @alu365.murciaeduca.es</div>
    <div class="error-msg" id="ee">Correo no válido</div>
  </div>
  <div class="field"><label>Curso</label>
    <select id="ic">
      <option value="">— Selecciona tu curso —</option>
      <option>1º ESO</option><option>2º ESO</option><option>3º ESO</option><option>4º ESO</option>
      <option>1º Bachillerato</option><option>2º Bachillerato</option>
    </select>
    <div class="error-msg" id="ec">Selecciona tu curso</div>
  </div>
  <button class="login-btn" onclick="doSL()">Comenzar el examen →</button>`}

function tF(){return`
  <div class="field"><label>Contraseña</label>
    <input type="password" id="ip" placeholder="Contraseña del profesor">
    <div class="error-msg" id="ep">Contraseña incorrecta</div>
  </div>
  <button class="login-btn" onclick="doTL()">Acceder al panel →</button>`}

function doSL(){
  const n=document.getElementById('in').value.trim(),
        e=document.getElementById('ie').value.trim().toLowerCase(),
        c=document.getElementById('ic').value;
  let v=1;
  if(!n||n.length<3){document.getElementById('en').style.display='block';v=0}else document.getElementById('en').style.display='none';
  if(!/^[^\s@]+@(alu365\.|alu\.)?murciaeduca\.es$/.test(e)){document.getElementById('ee').style.display='block';v=0}else document.getElementById('ee').style.display='none';
  if(!c){document.getElementById('ec').style.display='block';v=0}else document.getElementById('ec').style.display='none';
  if(!v)return;
  stu={name:n,email:e,curso:c};qs=sh(Q);cur=0;sc=0;tp=0;lg=[];showQ();
}
function doTL(){document.getElementById('ip').value===TEACHER_PASS?showTP():document.getElementById('ep').style.display='block'}

// ══════════════════════════════════════════════════
//  QUIZ
// ══════════════════════════════════════════════════
function showQ(){
  if(cur>=qs.length){finish();return}
  const q=qs[cur],pct=(cur/qs.length*100).toFixed(0);
  ct.innerHTML=`
    <div class="student-tag"><span class="dot"></span>${stu.name} · ${stu.curso}</div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="progress-info"><span>Pregunta ${cur+1} de ${qs.length}</span><span>${sc} pt${sc!==1?'s':''}</span></div>
    <div class="question-card">
      <span class="q-type">Test · nº ${q.n}</span>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.o.map((o,i)=>`<button class="option-btn" onclick="aT(${i})"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <button class="next-btn" id="nb" onclick="nQ()">Siguiente →</button>
    </div>`;
}

function aT(i){
  const q=qs[cur],bs=document.querySelectorAll('.option-btn');
  bs.forEach(b=>b.classList.add('disabled'));
  bs[q.c].classList.add('correct');
  const ok=i===q.c;
  if(!ok)bs[i].classList.add('wrong');
  tp++;if(ok)sc++;
  lg.push({q:q.q,n:q.n,ok,g:q.o[i],x:q.o[q.c],e:q.e});
  const fb=document.getElementById('fb');
  fb.className='feedback show '+(ok?'ok':'ko');
  fb.innerHTML=`<strong>${ok?'✓ Correcto':'✗ Incorrecto'}</strong>${!ok?`<span style="color:var(--correct);font-size:.83rem">Correcta: ${q.o[q.c]}</span><br>`:''}${q.e}`;
  document.getElementById('nb').className='next-btn show';
}

function nQ(){cur++;showQ()}

// ══════════════════════════════════════════════════
//  RESULTADOS
// ══════════════════════════════════════════════════
function finish(){
  const nota=parseFloat((sc/tp*10).toFixed(2)),pct=Math.round(sc/tp*100);
  const d=new Date(),dateStr=d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const entry={name:stu.name,email:stu.email,curso:stu.curso,nota,score:sc,tp,pct,date:dateStr};
  sR(entry);
  ct.innerHTML=`
    <div class="result-card">
      <div class="result-score">${nota.toFixed(1)}</div>
      <div class="result-label">sobre 10</div>
      <div class="result-stats">
        <span class="stat-pill">✓ ${sc} correctas</span>
        <span class="stat-pill">✗ ${tp-sc} incorrectas</span>
        <span class="stat-pill">${pct}%</span>
      </div>
      <div id="send-msg" class="sending-msg">Enviando resultado a Google Sheets…</div>
      <button class="restart-btn" onclick="showLogin('alumno')">Hacer otro intento</button>
    </div>
    <div class="review-section">
      <h3>Revisión de respuestas</h3>
      ${lg.map(l=>`
        <div class="review-item ${l.ok?'rev-correct':'rev-wrong'}">
          <div class="rev-q">${l.ok?'✓':'✗'} Pregunta ${l.n}: ${l.q}</div>
          <div class="rev-detail">
            ${l.ok?`<span class="ok">Correcta: ${l.x}</span>`:`<span class="ko">Tu respuesta: ${l.g}</span> · <span class="ok">Correcta: ${l.x}</span>`}<br>
            <span style="opacity:.8">${l.e}</span>
          </div>
        </div>`).join('')}
    </div>`;
  sendGS(entry);
}

function sendGS(entry){
  const msg=document.getElementById('send-msg');
  if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.includes('PENDIENTE')){
    if(msg)msg.innerHTML='<span style="color:var(--text-muted)">⚠ URL de Google Sheets pendiente de configurar</span>';
    return;
  }
  fetch(APPS_SCRIPT_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(entry)
  })
  .then(()=>{if(msg)msg.innerHTML='<span style="color:var(--correct)">✓ Resultado guardado en Google Sheets</span>'})
  .catch(()=>{if(msg)msg.innerHTML='<span style="color:var(--text-muted)">Guardado localmente (sin conexión)</span>'});
}

// ══════════════════════════════════════════════════
//  PANEL PROFESOR
// ══════════════════════════════════════════════════
function showTP(){
  const res=gR().sort((a,b)=>b.nota-a.nota);
  const rows=res.length?res.map((r,i)=>`<tr>
    <td class="${i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':''}">${i+1}</td>
    <td>${r.name}</td><td>${r.curso}</td><td>${r.email}</td>
    <td><strong>${r.nota}</strong></td><td>${r.score}/${r.tp}</td><td>${r.pct}%</td><td>${r.date}</td>
  </tr>`).join(''):'<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:1.5rem">Sin resultados todavía</td></tr>';

  ct.innerHTML=`<div class="panel-card">
    <h2>Panel del Profesor — Valores Cívicos y Éticos 4.º ESO</h2>
    <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:.5rem">Resultados locales · Los centralizados están en tu <strong>Google Sheets</strong>.</p>
    <div class="ranking-table-wrap"><table class="ranking-table">
      <thead><tr><th>#</th><th>Alumno/a</th><th>Curso</th><th>Correo</th><th>Nota</th><th>Aciertos</th><th>%</th><th>Fecha</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${res.length?`<div style="text-align:center">
      <button class="excel-btn" onclick="dlXL()">📊 Descargar Excel</button>
      <button class="excel-btn" onclick="if(confirm('¿Borrar datos locales?')){localStorage.removeItem(STORAGE_KEY);showTP()}" style="border-color:var(--wrong);color:var(--wrong);margin-left:.5rem">Borrar datos</button>
    </div>`:''}
    <div style="text-align:center;margin-top:1rem"><button class="restart-btn" onclick="showLogin('alumno')">← Volver al examen</button></div>
  </div>`;
}

function dlXL(){
  const res=gR().sort((a,b)=>b.nota-a.nota);
  const d=[['RECUPERACIÓN — VALORES CÍVICOS Y ÉTICOS 4.º ESO · IES Alquipir'],[''],
    ['#','Alumno/a','Curso','Correo','Nota','Aciertos','Total','%','Fecha']];
  res.forEach((r,i)=>d.push([i+1,r.name,r.curso,r.email,r.nota,r.score,r.tp,r.pct+'%',r.date]));
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(d);
  ws['!cols']=[{wch:5},{wch:30},{wch:18},{wch:34},{wch:6},{wch:8},{wch:6},{wch:6},{wch:18}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}}];
  XLSX.utils.book_append_sheet(wb,ws,'Resultados');
  XLSX.writeFile(wb,'Resultados_Valores_ESO.xlsx');
}

showLogin('alumno');
</script>
